# Example PlatformIO Project Configuration Override
# ------------------------------------------------------------------------------
# Copy to platformio_override.ini to activate overrides
# ------------------------------------------------------------------------------
# Please visit documentation: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = usermod_parologio_32
data_dir = ./wled00/littlefs

[env:usermod_parologio_32]
extends = env:esp32dev
platform = ${esp32.platform}
platform_packages = ${esp32.platform_packages}
board_build.partitions = ${esp32.default_partitions}
custom_usermods = parologio
board = wemos_d1_mini32
board_build.filesystem = littlefs
extra_scripts = ./littlefsbuilder.py
lib_deps = 
   https://github.com/lorol/LITTLEFS.git
   ${esp32.lib_deps}
build_flags = 
   ${common.build_flags} ${esp32.build_flags} 
   -D WLED_RELEASE_NAME=\"ESP32_USERMODS\"
   -D WLED_DEBUG
   -D SIZE_50X50
   -D WLED_DISABLE_BLYNK
   -D WLED_DISABLE_CRONIXIE
   -D WLED_DISABLE_HUESYNC
   -D WLED_DISABLE_INFRARED
   -D RLYPIN=19
   -D RLYMDE=1
   -D LEDPIN=16
   -D I2CSDAPIN=21
   -D I2CSCLPIN=22
   -D HW_PIN_SDA=21
   -D HW_PIN_SCL=22
   -D DEFAULT_LED_COUNT=114
   -D LOROL_LITTLEFS
   ; -D WLED_DISABLE_WEBSOCKETS
   ; -D WLED_DEBUG_FS
   ; -D WLED_DEBUG_HOST='"192.168.1.21"'
   ; -D WLED_DEBUG_NET_PORT=7868
   ; -D IS_STONE=0
; board_build.filesystem = littlefs
; board_build.partitions = tools/WLED_ESP32_4MB_1MB_FS.csv

; *********************************************************************
; *** Use custom settings from file my_config.h
;   -DWLED_USE_MY_CONFIG
; *********************************************************************
;  -D WLED_DISABLE_OTA
;  -D WLED_DISABLE_ALEXA
;  -D WLED_DISABLE_BLYNK
;  -D WLED_DISABLE_CRONIXIE
;  -D WLED_DISABLE_HUESYNC
;  -D WLED_DISABLE_INFRARED
;  -D WLED_DISABLE_WEBSOCKETS
; PIN defines - uncomment and change, if needed:
;   -D LEDPIN=2
;   -D BTNPIN=0
;   -D TOUCHPIN=T0
;   -D IRPIN=4
;   -D RLYPIN=12
;   -D RLYMDE=1
; digital LED strip types - uncomment only one ! - this will disable WS281x / SK681x support
;   -D USE_APA102
;   -D USE_WS2801
;   -D USE_LPD8806
; PIN defines for 2 wire LEDs
;   -D CLKPIN=0
;   -D DATAPIN=2
; to drive analog LED strips (aka 5050) hardware configuration is no longer necessary
; configure the settings in the UI as follows (hard):
;   for the Magic Home LED Controller use PWM pins 5,12,13,15
;   for the H801 controller use PINs 15,13,12,14 (W2 = 04)
;   for the BW-LT11 controller use PINs 12,4,14,5

