[platformio]
default_envs = usermod_parologio_32
data_dir = ./usermods/parologio/data

[env:usermod_parologio_32]
extends = env:esp32dev
board_build.filesystem = littlefs
extra_scripts = ./littlefsbuilder.py
lib_deps = 
   https://github.com/lorol/LITTLEFS.git
   ${esp32.lib_deps}
build_flags = ${common.build_flags_esp32} 
   -D WLED_RELEASE_NAME=ESP32 
   -D USERMOD_PAROLOGIO
   -D SIZE_50X50
   -D USERMOD_RTC
   -D RLYPIN=19
   -D RLYMDE=1
   -D I2CSCLPIN=22
   -D I2CSDAPIN=21
   -D HW_PIN_SCL=22
   -D HW_PIN_SDA=21
   -D WLED_DEBUG
   # -D DEFAULT_AP_PASS='"parologio1234"' # TODO: DA TESTARE!
   
   # SI POSSONO PRENDERE DA CONFIG
   # TODO: MANCA LENGTH 114 led
   # TODO: MANCA GPIO 16 per uscita (io2 per esp8266)

   ;-D WLED_DISABLE_BROWNOUT_DET
   ;-D WLED_DISABLE_BLYNK
   ;-D WLED_DISABLE_CRONIXIE
   ;-D WLED_DISABLE_HUESYNC
   ;-D WLED_DISABLE_INFRARED
   ;-D WLED_DISABLE_WEBSOCKETS
   ;-D HW_PIN_SCL=35
   ;-D HW_PIN_SDA=33
   ;-D HW_PIN_CLOCKSPI=7
   ;-D HW_PIN_DATASPI=11
   ;-D HW_PIN_MISOSPI=9

[env:usermod_parologio]
extends = env:lolin_s2_mini
lib_deps = ${env.lib_deps}
build_flags = ${common.build_flags_esp8266} 
   -D USERMOD_PAROLOGIO
   -D SIZE_50X50
   -D USERMOD_RTC
   -D RLYPIN=12
   -D RLYMDE=1
   -D I2CSCLPIN=5
   -D I2CSDAPIN=4
   -D WLED_DISABLE_BLYNK
   -D WLED_DISABLE_CRONIXIE
   -D WLED_DISABLE_HUESYNC
   -D WLED_DISABLE_INFRARED
   -D WLED_DISABLE_WEBSOCKETS
   -D WLED_DEBUG
   ; -D WLED_DEBUG_HOST='"192.168.1.21"'
   ; -D WLED_DEBUG_NET_PORT=7868
   ;-D IS_STONE=0

; *********************************************************************
; *** Use custom settings from file my_config.h
;   -DWLED_USE_MY_CONFIG
; *********************************************************************
;  -D WLED_DISABLE_OTA
;  -D WLED_DISABLE_ALEXA
;  -D WLED_DISABLE_BLYNK
;  -D WLED_DISABLE_CRONIXIE
;  -D WLED_DISABLE_HUESYNC
;  -D WLED_DISABLE_INFRARED
;  -D WLED_DISABLE_WEBSOCKETS
; PIN defines - uncomment and change, if needed:
;   -D LEDPIN=2
;   -D BTNPIN=0
;   -D TOUCHPIN=T0
;   -D IRPIN=4
;   -D RLYPIN=12
;   -D RLYMDE=1
; digital LED strip types - uncomment only one ! - this will disable WS281x / SK681x support
;   -D USE_APA102
;   -D USE_WS2801
;   -D USE_LPD8806
; PIN defines for 2 wire LEDs
;   -D CLKPIN=0
;   -D DATAPIN=2
; to drive analog LED strips (aka 5050) hardware configuration is no longer necessary
; configure the settings in the UI as follows (hard):
;   for the Magic Home LED Controller use PWM pins 5,12,13,15
;   for the H801 controller use PINs 15,13,12,14 (W2 = 04)
;   for the BW-LT11 controller use PINs 12,4,14,5
